<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__PAGE_TITLE__</title>
<style>
  /* HUD is DOM, not canvas: captureDataUrl() reads pixels from the canvas, so evidence frames never
     contain this chrome and it never has to be hidden before a capture. */
  :root { --ink:#e9eaec; --dim:#8f949c; --line:rgba(255,255,255,.14); --acc:#3b82f6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:#0e1013; color:var(--ink);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC",system-ui,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #view { position:fixed; inset:0; display:block; }
  .hud { position:fixed; pointer-events:none; z-index:10; }
  .hud > * { pointer-events:auto; }

  .title { top:26px; left:30px; }
  .title h1 { font-size:17px; font-weight:600; letter-spacing:.02em; }
  .title p { margin-top:7px; font-size:12px; color:var(--dim); line-height:1.6; max-width:340px; }
  .title b { color:var(--ink); font-weight:600; }

  .readout {
    left:30px; bottom:104px; opacity:0; transform:translateY(6px);
    transition:opacity .18s ease, transform .18s ease;
    border-left:2px solid var(--acc); padding:8px 0 8px 12px;
  }
  .readout.active { opacity:1; transform:none; }
  .readout b { display:block; font-size:13px; font-weight:600; }
  .readout span { display:block; margin-top:4px; font-size:11px; color:var(--dim); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

  .bar { left:30px; bottom:30px; display:flex; gap:8px; flex-wrap:wrap; }
  .bar button {
    font:inherit; font-size:12px; color:var(--dim); cursor:pointer;
    background:rgba(255,255,255,.04); border:1px solid var(--line);
    padding:8px 13px; border-radius:999px; backdrop-filter:blur(8px);
    transition:all .15s ease;
  }
  .bar button:hover { color:var(--ink); border-color:rgba(255,255,255,.3); }
  .bar button.on { color:#fff; background:var(--acc); border-color:var(--acc); }

  .refcard {
    top:26px; right:30px; width:260px; opacity:0; transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none;
    background:rgba(20,23,27,.9); border:1px solid var(--line); border-radius:12px;
    padding:10px; backdrop-filter:blur(12px);
  }
  .refcard.show { opacity:1; transform:none; }
  .refcard img { width:100%; border-radius:7px; display:block; }
  .refcard figcaption { margin-top:8px; font-size:10.5px; color:var(--dim); line-height:1.5; }

  .credit { right:30px; bottom:30px; font-size:10.5px; color:#5c616a; text-align:right; line-height:1.6; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud title">
  <h1>__TITLE__</h1>
  <p>__SUBTITLE__</p>
</div>

<div class="hud readout" id="readout"></div>

<div class="hud bar">
  <button id="btn-explode">__BTN_EXPLODE__</button>
  <button id="btn-wire">__BTN_WIRE__</button>
  <button id="btn-rotate">__BTN_ROTATE__</button>
  <button id="btn-ref">__BTN_REFERENCE__</button>
  <button id="btn-reset">__BTN_RESET__</button>
</div>

<figure class="hud refcard" id="refcard">
  <img src="ref.jpg" alt="reference photo" />
  <figcaption>__REF_CAPTION__</figcaption>
</figure>

<div class="hud credit">
  __CREDIT__ · <span id="fps">--</span> fps
</div>

<script src="app.js?v=1"></script>
</body>
</html>
